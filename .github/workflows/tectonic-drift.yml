name: Tectonic Drift Detection
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LENS_ENABLED: true
      LENS_SWARM_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (if any)
        # This repo is stdlib-only (node builtins); there is no package.json.
        # Skip the install instead of failing when none exists, so a future
        # package.json still gets installed.
        run: |
          if [ -f package.json ]; then
            bun install --no-save || npm install
          else
            echo "no package.json; skipping install (stdlib-only project)"
          fi
      - name: Analyze drift
        run: |
          node -e "
          const { LensOrchestrator } = require('./lib/lens-orchestrator');
          const orch = new LensOrchestrator({ lensDir: './src/_11ty/lenses' });
          orch.discover().then(() => {
            return orch.analyze('tectonic', {}, { lastPush: new Date().toISOString(), repo: 'effusion-labs', ciMode: true });
          }).then(r => {
            console.log('Health Score:', r.healthScore);
            console.log('Drift Count:', r.driftCount);
            console.log('CI Threshold:', r.ciThreshold || 50);
            const threshold = r.ciThreshold || 50;
            if (r.healthScore < threshold) {
              console.error('WARNING: Health score ' + r.healthScore + ' below threshold ' + threshold);
              process.exit(1);
            }
          });
          